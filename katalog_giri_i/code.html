<script>
        // Tab Switching Logic
        function switchTab(tabName) {
            const formPassword = document.getElementById('form-password');
            const formCode = document.getElementById('form-code');
            const indicator = document.getElementById('tab-indicator');
            const btnPassword = document.getElementById('btn-password');
            const btnCode = document.getElementById('btn-code');

            if (tabName === 'password') {
                // UI Changes
                indicator.style.transform = 'translateX(0)';
                btnPassword.classList.replace('text-on-surface-variant', 'text-primary');
                btnCode.classList.replace('text-primary', 'text-on-surface-variant');
                
                // Form Visibility
                formCode.style.opacity = '0';
                setTimeout(() => {
                    formCode.classList.add('hidden');
                    formPassword.classList.remove('hidden');
                    setTimeout(() => formPassword.style.opacity = '1', 50);
                }, 300);

            } else {
                // UI Changes
                indicator.style.transform = 'translateX(100%)';
                btnCode.classList.replace('text-on-surface-variant', 'text-primary');
                btnPassword.classList.replace('text-primary', 'text-on-surface-variant');
                
                // Form Visibility
                formPassword.style.opacity = '0';
                setTimeout(() => {
                    formPassword.classList.add('hidden');
                    formCode.classList.remove('hidden');
                    setTimeout(() => {
                        formCode.style.opacity = '1';
                        // Auto focus first input when switching to code
                        document.querySelector('.otp-input').focus();
                    }, 50);
                }, 300);
            }
        }

        // OTP Input Auto-advance Logic
        const otpInputs = document.querySelectorAll('.otp-input');
        
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Only allow numbers
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                
                // Move to next input if value is entered
                if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                // Move to previous input on backspace if current is empty
                if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
            
            // Auto select content on focus for easy replacement
            input.addEventListener('focus', function() {
                this.select();
            });
        });
    </script>
