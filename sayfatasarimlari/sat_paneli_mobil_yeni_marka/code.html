<!-- Overlay -->
<div class="fixed inset-0 bg-black/60 z-[60] hidden backdrop-blur-sm transition-opacity opacity-0" id="drawer-overlay"></div>
<script>
    const menuDrawer = document.getElementById('menu-drawer');
    const filterDrawer = document.getElementById('filter-drawer');
    const cartDrawer = document.getElementById('cart-drawer');
    const overlay = document.getElementById('drawer-overlay');
    const body = document.body;

    function openDrawer(drawer) {
        drawer.classList.remove('translate-x-full', '-translate-x-full');
        overlay.classList.remove('hidden');
        setTimeout(() => overlay.classList.add('opacity-100'), 10);
        body.classList.add('overflow-hidden');
    }

    function closeAll() {
        menuDrawer.classList.add('-translate-x-full');
        filterDrawer.classList.add('translate-x-full');
        cartDrawer.classList.add('translate-x-full');
        overlay.classList.remove('opacity-100');
        setTimeout(() => overlay.classList.add('hidden'), 300);
        body.classList.remove('overflow-hidden');
    }

    document.getElementById('toggle-menu').addEventListener('click', () => openDrawer(menuDrawer));
    document.getElementById('toggle-filter').addEventListener('click', () => openDrawer(filterDrawer));
    document.getElementById('toggle-cart').addEventListener('click', () => openDrawer(cartDrawer));
    document.getElementById('close-filter').addEventListener('click', closeAll);
    document.getElementById('close-cart').addEventListener('click', closeAll);
    overlay.addEventListener('click', closeAll);

    // Counter
    document.addEventListener('click', function(e) {
        if (e.target.tagName === 'BUTTON' && (e.target.innerText === '+' || e.target.innerText === '-')) {
            const input = e.target.parentElement.querySelector('input');
            let val = parseInt(input.value);
            if (e.target.innerText === '+') val++;
            else if (val > 1) val--;
            input.value = val;
        }
    });
</script>
