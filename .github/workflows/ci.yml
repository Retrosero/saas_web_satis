name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint ve Tip Kontrolu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: pnpm kur
        uses: pnpm/action-setup@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Bagimliliklari kur
        run: pnpm install --frozen-lockfile

      - name: Format kontrolu
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tip kontrolu
        run: pnpm typecheck

  test:
    name: Testler
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saas_test
          POSTGRES_PASSWORD: saas_test
          POSTGRES_DB: saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: pnpm kur
        uses: pnpm/action-setup@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Bagimliliklari kur
        run: pnpm install --frozen-lockfile

      - name: Backend testleri
        run: pnpm --filter @saas/api test
        env:
          DATABASE_URL: postgresql://saas_test:saas_test@localhost:5432/saas_test

      - name: Frontend testleri
        run: pnpm --filter @saas/web test

  build:
    name: Derleme
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: pnpm kur
        uses: pnpm/action-setup@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Bagimliliklari kur
        run: pnpm install --frozen-lockfile

      - name: Derle
        run: pnpm build

